name: OPM Music Video

on:
  schedule:
    # Once daily — 6:00 PM Philippine Time (UTC+8 = UTC+0 10:00)
    - cron: "0 10 * * *"   # 6:00 PM PHT
  workflow_dispatch:       # allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts + audio libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core \
            libsndfile1 libsndfile1-dev libasound2-dev

      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: models/
          key: kokoro-models-v1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret files
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDS: ${{ secrets.YOUTUBE_CREDS }}
        run: |
          echo "$YOUTUBE_TOKEN" > token.json
          echo "$YOUTUBE_CREDS" > credentials.json

      - name: Write .env
        env:
          KIE_API_KEY:          ${{ secrets.KIE_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "KIE_API_KEY=$KIE_API_KEY"               > .env
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY"         >> .env
          echo "GROQ_API_KEY=$GROQ_API_KEY"             >> .env
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"     >> .env

      - name: Generate and upload OPM music video
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist_ids.json run_log.txt || true
          git diff --cached --quiet || git commit -m "chore: update run state [skip ci]"
          git push || true
