name: Daily Math Quiz

on:
  schedule:
    # 3x daily — 6pm, 2pm, 10pm Philippine Time (UTC+8)
    - cron: "0 10 * * *"   # 6:00 PM PHT
    - cron: "0 6 * * *"    # 2:00 PM PHT
    - cron: "0 14 * * *"   # 10:00 PM PHT
  workflow_dispatch:  # also allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit quiz_history.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts + audio libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core \
            libsndfile1 libsndfile1-dev libasound2-dev \
            xvfb chromium-browser

      # Cache the large Kokoro model files between runs (~114MB, one-time download)
      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: models/
          key: kokoro-models-v1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret files
        env:
          YOUTUBE_TOKEN:    ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDS:    ${{ secrets.YOUTUBE_CREDS }}
          TIKTOK_COOKIES:   ${{ secrets.TIKTOK_COOKIES }}
        run: |
          echo "$YOUTUBE_TOKEN"  > token.json
          echo "$YOUTUBE_CREDS"  > credentials.json
          echo "$TIKTOK_COOKIES" > tiktok_cookies.json

      - name: Write .env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" > .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY"         >> .env

      - name: Generate and post quiz
        run: |
          python -c "
          import asyncio, sys, json, os, requests
          from datetime import datetime, date

          # ── Ramp-up check ─────────────────────────────────────────────────
          SLOT_HOURS = [10, 6, 14]
          current_hour = datetime.utcnow().hour

          cfg_path = 'scheduler_config.json'
          cfg = json.load(open(cfg_path)) if os.path.exists(cfg_path) else {}
          if 'ramp_start' not in cfg:
              cfg['ramp_start'] = date.today().isoformat()
              json.dump(cfg, open(cfg_path, 'w'), indent=2)

          elapsed_days = (date.today() - date.fromisoformat(cfg['ramp_start'])).days
          max_slots = 1 if elapsed_days < 7 else (2 if elapsed_days < 14 else 3)
          slot_index = SLOT_HOURS.index(current_hour) if current_hour in SLOT_HOURS else 0
          if slot_index >= max_slots:
              print(f'[ramp] Day {elapsed_days}: slot {slot_index} skipped (max_slots={max_slots})')
              sys.exit(0)
          print(f'[ramp] Day {elapsed_days}: running slot {slot_index} of {max_slots}')

          # ── Generate quiz question via OpenRouter ───────────────────────────
          from dotenv import load_dotenv
          load_dotenv()
          openrouter_key = os.getenv('OPENROUTER_API_KEY', '')
          pexels_key     = os.getenv('PEXELS_API_KEY', '')

          CATEGORIES = ['Mental Math', 'Fractions', 'Algebra', 'Geometry', 'Word Problem',
                        'Percentages', 'Number Sense', 'Trick Question']
          import random
          category = random.choice(CATEGORIES)

          prompt = f'''Generate a viral YouTube Shorts math quiz question.
          Category: {category}
          Return ONLY a valid JSON object with these exact keys:
          {{
            \"question\": \"...\",
            \"options\": {{\"A\": \"...\", \"B\": \"...\", \"C\": \"...\", \"D\": \"...\"}},
            \"correct_answer\": \"A\",
            \"explanation\": \"Brief explanation\",
            \"trap_answer\": \"B\",
            \"category\": \"{category.upper()}\",
            \"image_query\": \"relevant pexels search term\"
          }}
          Make it tricky but solvable. The trap_answer should be what most people wrongly choose.'''

          resp = requests.post(
              'https://openrouter.ai/api/v1/chat/completions',
              headers={'Authorization': f'Bearer {openrouter_key}', 'Content-Type': 'application/json'},
              json={'model': 'google/gemini-2.0-flash-001', 'messages': [{'role': 'user', 'content': prompt}]},
              timeout=30
          )
          resp.raise_for_status()
          raw = resp.json()['choices'][0]['message']['content'].strip()
          # strip markdown code fences if present
          if raw.startswith('\`\`\`'):
              raw = raw.split('\`\`\`')[1]
              if raw.startswith('json'):
                  raw = raw[4:]
          quiz_data = json.loads(raw.strip())
          print(f'[quiz] Question: {quiz_data[\"question\"]}')

          # ── Generate video ─────────────────────────────────────────────────
          from quiz_renderer import create_quiz_video
          ts  = datetime.utcnow().strftime('%Y%m%d_%H%M')
          out = f'output/quiz_{ts}'
          final_path, _ = asyncio.run(create_quiz_video(
              quiz_data=quiz_data, output_dir=out, pexels_key=pexels_key
          ))
          print(f'[quiz] Video: {final_path}')

          # ── Upload to YouTube ──────────────────────────────────────────────
          from main import upload_to_youtube
          q = quiz_data['question'][:60]
          title = f'Can You Solve This? {q} 🤔 #mathquiz #shorts'
          desc  = (f'{quiz_data[\"question\"]}\n\nAnswer: {quiz_data[\"correct_answer\"]}\n'
                   f'{quiz_data.get(\"explanation\",\"\")}\n\n#MathQuiz #BrainTeaser #Shorts')
          tags  = ['math quiz', 'brain teaser', 'shorts', 'math challenge', category.lower()]
          url = upload_to_youtube(
              video_path=final_path, thumbnail_path='',
              title=title, description=desc, tags=tags,
              genre_key='math_quiz'
          )
          print(f'[quiz] YouTube: {url}')
          "

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_history.json scheduler_config.json
          git diff --cached --quiet || git commit -m "chore: update quiz state [skip ci]"
          git push
