name: Daily Math Quiz

on:
  schedule:
    # 3x daily — 6pm, 2pm, 10pm Philippine Time (UTC+8)
    - cron: "0 10 * * *"   # 6:00 PM PHT
    - cron: "0 6 * * *"    # 2:00 PM PHT
    - cron: "0 14 * * *"   # 10:00 PM PHT
  workflow_dispatch:  # also allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit quiz_history.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts + audio libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core \
            libsndfile1 libsndfile1-dev libasound2-dev \
            xvfb chromium-browser

      # Cache the large Kokoro model files between runs (~114MB, one-time download)
      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: models/
          key: kokoro-models-v1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret files
        env:
          YOUTUBE_TOKEN:    ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDS:    ${{ secrets.YOUTUBE_CREDS }}
          TIKTOK_COOKIES:   ${{ secrets.TIKTOK_COOKIES }}
        run: |
          echo "$YOUTUBE_TOKEN"  > token.json
          echo "$YOUTUBE_CREDS"  > credentials.json
          echo "$TIKTOK_COOKIES" > tiktok_cookies.json

      - name: Write .env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" > .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY"         >> .env

      - name: Generate and post quiz
        run: |
          python -c "
          import asyncio, sys, json, os
          from datetime import datetime, date

          # ── Ramp-up check ─────────────────────────────────────────────────
          # Slot order by UTC hour: 22→slot0(morning PHT), 06→slot1(afternoon PHT), 14→slot2(evening PHT)
          SLOT_HOURS = [10, 6, 14]   # must match cron order in this file
          current_hour = datetime.utcnow().hour

          cfg_path = 'scheduler_config.json'
          if os.path.exists(cfg_path):
              with open(cfg_path) as f:
                  cfg = json.load(f)
          else:
              cfg = {}

          # Seed ramp_start on very first run
          if 'ramp_start' not in cfg:
              cfg['ramp_start'] = date.today().isoformat()
              with open(cfg_path, 'w') as f:
                  json.dump(cfg, f, indent=2)

          elapsed_days = (date.today() - date.fromisoformat(cfg['ramp_start'])).days
          if elapsed_days < 7:
              max_slots = 1
          elif elapsed_days < 14:
              max_slots = 2
          else:
              max_slots = 3

          # Find which slot index this run corresponds to
          slot_index = SLOT_HOURS.index(current_hour) if current_hour in SLOT_HOURS else 0
          if slot_index >= max_slots:
              print(f'[ramp] Day {elapsed_days}: slot {slot_index} skipped (max_slots={max_slots})')
              sys.exit(0)

          print(f'[ramp] Day {elapsed_days}: running slot {slot_index} of {max_slots}')

          # ── Generate & upload ──────────────────────────────────────────────
          from main import create_single_short, get_topic
          ts    = datetime.utcnow().strftime('%Y%m%d_%H%M')
          out   = f'output/auto_{ts}'
          topic = get_topic('math_quiz')
          print(f'Topic: {topic}')

          async def main():
              result = await create_single_short(
                  topic=topic,
                  niche='math_quiz',
                  output_dir=out,
                  upload=True,
              )
              print('YouTube:', result.get('url'))
              print('TikTok: ', result.get('tiktok_url'))

          asyncio.run(main())
          "

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_history.json scheduler_config.json challenge_counter.json
          git diff --cached --quiet || git commit -m "chore: update quiz state [skip ci]"
          git push
