name: Daily Math Quiz

on:
  schedule:
    # Every day at 10:00 UTC = 6:00 PM Philippine Time (UTC+8)
    - cron: "0 10 * * *"
  workflow_dispatch:  # also allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit quiz_history.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts + audio libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core \
            libsndfile1 libsndfile1-dev libasound2-dev \
            xvfb chromium-browser

      # Cache the large Kokoro model files between runs (~114MB, one-time download)
      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: models/
          key: kokoro-models-v1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret files
        env:
          YOUTUBE_TOKEN:    ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDS:    ${{ secrets.YOUTUBE_CREDS }}
          TIKTOK_COOKIES:   ${{ secrets.TIKTOK_COOKIES }}
        run: |
          echo "$YOUTUBE_TOKEN"  > token.json
          echo "$YOUTUBE_CREDS"  > credentials.json
          echo "$TIKTOK_COOKIES" > tiktok_cookies.json

      - name: Write .env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" > .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY"         >> .env

      - name: Generate and post quiz
        run: |
          python -c "
          import asyncio, os, traceback, random
          from main import create_single_short
          from datetime import datetime

          TOPICS = [
              'Can you solve this in 5 seconds',
              '99 percent of people get this wrong',
              'Simple math that tricks everyone',
              'Only geniuses solve this fast',
              'Most adults fail this grade school math',
              'The math problem that went viral',
              'Solve this before the timer runs out',
              'The trick question everyone gets wrong',
              'Can you beat the calculator',
              'What is the real answer here',
          ]

          async def main():
              ts    = datetime.utcnow().strftime('%Y%m%d_%H%M')
              out   = f'output/auto_{ts}'
              topic = random.choice(TOPICS)
              print(f'Topic: {topic}')
              result = await create_single_short(
                  topic=topic,
                  niche='math_quiz',
                  output_dir=out,
                  upload=True,
              )
              print('YouTube:', result.get('url'))
              print('TikTok: ', result.get('tiktok_url'))

          asyncio.run(main())
          "

      - name: Commit updated quiz history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_history.json
          git diff --cached --quiet || git commit -m "chore: update quiz_history [skip ci]"
          git push
