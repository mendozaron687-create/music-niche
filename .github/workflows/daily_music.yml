name: Daily OPM Music Video

on:
  schedule:
    - cron: "0 10 * * *"   # 6:00 PM PHT — prime time peak
  workflow_dispatch:   # also trigger manually from GitHub UI
    inputs:
      genre:
        description: "Genre key (leave blank for random hugot)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # full render + upload can take 30-40 min
    permissions:
      contents: write      # needed to push used_stories.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg \
            fonts-liberation fonts-liberation2 fonts-dejavu-core fonts-dejavu \
            fonts-freefont-ttf fonts-open-sans fonts-urw-base35 \
            libsndfile1 libsndfile1-dev
          # Fontconfig aliases: map Windows font names → installed Linux equivalents
          # libass (ffmpeg subtitle renderer) uses fontconfig to resolve font families
          mkdir -p /etc/fonts/conf.d
          cat > /etc/fonts/conf.d/99-ci-aliases.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias><family>Arial Bold</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias><family>Arial Black</family><prefer><family>Liberation Sans</family></prefer></alias>
            <alias><family>Impact</family><prefer><family>FreeSans</family></prefer></alias>
          </fontconfig>
          EOF
          fc-cache -f -v

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write secret files
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CREDS: ${{ secrets.YOUTUBE_CREDS }}
        run: |
          echo "$YOUTUBE_TOKEN" > token.json
          echo "$YOUTUBE_CREDS" > credentials.json

      - name: Write .env
        env:
          KIE_API_KEY:        ${{ secrets.KIE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "KIE_API_KEY=$KIE_API_KEY"               > .env
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY"         >> .env
          echo "GROQ_API_KEY=$GROQ_API_KEY"             >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY"         >> .env
          echo "HF_HUB_DISABLE_SYMLINKS_WARNING=1"      >> .env

      - name: Restore used_stories cache
        uses: actions/cache@v4
        with:
          path: used_stories.json
          key: used-stories-${{ github.run_number }}
          restore-keys: used-stories-

      - name: Generate and post music video
        run: |
          # Use manually specified genre, or let main.py pick randomly
          if [ -n "${{ github.event.inputs.genre }}" ]; then
            GENRE="${{ github.event.inputs.genre }}"
            GENRE_ARG="--genre $GENRE"
          else
            GENRE_ARG=""
            GENRE="random"
          fi
          echo "Running genre: $GENRE"

          # First attempt — full pipeline including Suno
          if python main.py $GENRE_ARG; then
            echo "✅ First attempt succeeded."
            exit 0
          fi

          # First attempt failed. Check if Suno already generated a track
          # (suno_checkpoint.json written immediately after Suno returns).
          # If found, re-render the video without spending credits again.
          CHECKPOINT=$(find output -name "suno_checkpoint.json" 2>/dev/null | sort | tail -1)
          if [ -n "$CHECKPOINT" ]; then
            OUTPUT_DIR=$(dirname "$CHECKPOINT")
            echo "⚠️  First attempt failed but Suno checkpoint found: $CHECKPOINT"
            echo "🔄 Retrying video render from checkpoint (no credits spent)..."
            python main.py --resume "$OUTPUT_DIR" $GENRE_ARG
          else
            echo "❌ No Suno checkpoint found — Suno itself failed. Full failure."
            exit 1
          fi

      - name: Commit updated used_stories.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add used_stories.json
          git diff --cached --quiet || git commit -m "chore: update used stories [skip ci]"
          git pull --rebase origin main || true
          git push
