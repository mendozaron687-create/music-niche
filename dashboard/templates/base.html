<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Shorts Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>YT Shorts</h3>
            <small class="text-muted">Automation Dashboard</small>
        </div>
        <ul class="list-unstyled components">
            <li class="{{ 'active' if request.path == '/' }}">
                <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
            </li>
            <li class="{{ 'active' if request.path == '/create' }}">
                <a href="/create"><i class="bi bi-plus-circle"></i> Create Video</a>
            </li>
            <li class="{{ 'active' if request.path == '/batch' }}">
                <a href="/batch"><i class="bi bi-collection-play"></i> Batch Create</a>
            </li>
            <li class="{{ 'active' if request.path == '/history' }}">
                <a href="/history"><i class="bi bi-clock-history"></i> History</a>
            </li>
            <li class="{{ 'active' if request.path == '/schedule' }}">
                <a href="/schedule"><i class="bi bi-calendar-check"></i> Scheduler</a>
            </li>
            <li class="{{ 'active' if request.path == '/settings' }}">
                <a href="/settings"><i class="bi bi-gear"></i> Settings</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <span class="badge bg-success">Online</span>
        </div>
    </nav>
    <div id="content">
        <nav class="navbar navbar-dark top-navbar">
            <div class="container-fluid">
                <button id="sidebarCollapse" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-list"></i>
                </button>
                <span class="navbar-brand ms-3">{% block title %}Dashboard{% endblock %}</span>
                <div class="ms-auto">
                    <span class="badge bg-danger">
                        <i class="bi bi-camera-video"></i>
                        <span id="activeJobCount">0</span> Active
                    </span>
                </div>
            </div>
        </nav>
        <div class="container-fluid main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
